<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calcolator</title>
</head>

<body>

    <main class="main">
        <div class="output">
            <span class="calculator__output" id="out">0</span>
        </div>
        <div class="input">
            <div class="button green">C</div>
            <div class="button green">d</div>
            <div class="button levender">/</div>
            <div class="button levender">X</div>
            <div class="button whtie">7</div>
            <div class="button whtie">8</div>
            <div class="button whtie">9</div>
            <div class="button levender">-</div>
            <div class="button whtie">4</div>
            <div class="button whtie">5</div>
            <div class="button whtie">6</div>
            <div class="button levender">+</div>
            <div class="button whtie">1</div>
            <div class="button whtie">2</div>
            <div class="button whtie">3</div>
            <div class="button green">=</div>
            <div class="button whtie">0</div>
            <div class="button whtie">.</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
