<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Waves/0.7.6/waves.min.css">
    <title>Calculator</title>
</head>

<body>

    <main class="main">
        <div class="output">
            <span class="calculator__output" id="output">0</span>
        </div>

        <div class="input">
            <button class="button green" id="clear">C</button>
            <button class="button green" id="delete">d</button>
            <button class="button lavender" id="divide">/</button>
            <button class="button lavender" id="multiply">x</button>

            <button class="button white" id="seven">7</button>
            <button class="button white" id="eight">8</button>
            <button class="button white" id="nine">9</button>
            <button class="button lavender" id="subtract">-</button>

            <button class="button white" id="four">4</button>
            <button class="button white" id="five">5</button>
            <button class="button white" id="six">6</button>
            <button class="button lavender" id="add">+</button>

            <button class="button white" id="one">1</button>
            <button class="button white" id="two">2</button>
            <button class="button white" id="three">3</button>
            <button class="button green" id="equal">=</button>

            <button class="button white" id="zero">0</button>
            <button class="button white" id="decimal">.</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
